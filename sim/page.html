<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Fish pond simulator</title>
<style>
  :root { --bg: #11161c; --panel: #1b222b; --fg: #e8edf2; --muted: #93a1b0; --on: #2fbf71; --off: #3a4552; --accent: #f0b429; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.4 system-ui, "Segoe UI", sans-serif; }
  .wrap { display: flex; gap: 16px; padding: 16px; align-items: flex-start; flex-wrap: wrap; }
  .cam { width: 1280px; max-width: 100%; aspect-ratio: 16/9; background: #000; border-radius: 6px; display: block; }
  .side { width: 300px; display: flex; flex-direction: column; gap: 12px; }
  .box { background: var(--panel); border-radius: 8px; padding: 12px; }
  h2 { margin: 0 0 8px; font-size: 13px; letter-spacing: .06em; text-transform: uppercase; color: var(--muted); }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin: 6px 0; }
  button { font: inherit; color: var(--fg); background: var(--off); border: 0; border-radius: 6px; padding: 8px 12px; cursor: pointer; min-width: 92px; }
  button.on { background: var(--on); color: #06210f; font-weight: 600; }
  button.act { background: var(--accent); color: #2a1c00; font-weight: 600; }
  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
  .k { color: var(--muted); }
  #log { font-size: 12px; color: var(--muted); min-height: 90px; white-space: pre-line; }
  details summary { cursor: pointer; color: var(--muted); }
</style>
</head>
<body>
<div class="wrap">
  <img class="cam" src="/video.mjpg" alt="camera">
  <div class="side">
    <div class="box">
      <h2>Equipment</h2>
      <div class="row"><span>Aerator</span><button id="aerator" data-cmd="aerator">off</button></div>
      <div class="row"><span>Pump</span><button id="pump" data-cmd="pump">off</button></div>
      <div class="row"><span>Feeder</span><button class="act" data-send="feed">Feed</button></div>
      <div class="row"><span>Bird scarer</span><button class="act" data-send="scare">Scare</button></div>
    </div>
    <div class="box">
      <h2>Demo</h2>
      <div class="grid">
        <button data-send="night">Night now</button><button data-send="day">Day now</button>
        <button data-send="heron">Heron now</button><button data-send="rain">Rain now</button>
        <button data-send="restock">Restock fish</button><button id="drain">Water low</button>
        <select id="speed" title="real minutes per simulated day">
          <option value="2">1 day = 2 min</option><option value="6" selected>1 day = 6 min</option>
          <option value="30">1 day = 30 min</option><option value="1440">real time</option>
        </select>
      </div>
    </div>
    <div class="box">
      <details><summary>What the model knows (Inspector does not see this)</summary>
        <div id="state" class="k"></div></details>
      <div id="log"></div>
    </div>
  </div>
</div>
<script>
const send = (command, value) => fetch('/api/command', { method: 'POST', headers: { 'Content-Type': 'application/json' },
  body: JSON.stringify({ command, value }) }).then(r => r.json()).then(show)
function show(r) {
  const s = r.state || r
  for (const k of ['aerator', 'pump']) {
    const b = document.getElementById(k); b.textContent = s[k] ? 'on' : 'off'; b.classList.toggle('on', !!s[k])
  }
  document.getElementById('state').textContent =
    `day ${s.day} ${String(Math.floor(s.hour)).padStart(2, '0')}:${String(Math.floor(s.hour % 1 * 60)).padStart(2, '0')} · oxygen ${s.oxygen} mg/L · level ${s.level}% · fish ${s.fish} (heron took ${s.lost_heron}, no oxygen ${s.lost_oxygen})`
  document.getElementById('log').textContent = (s.log || []).slice().reverse().join('\n')
  document.getElementById('speed').value = String(s.day_minutes)
}
document.querySelectorAll('[data-cmd]').forEach(b => b.onclick = () => send(b.dataset.cmd + (b.classList.contains('on') ? '_off' : '_on')))
document.querySelectorAll('[data-send]').forEach(b => b.onclick = () => send(b.dataset.send))
document.getElementById('drain').onclick = () => send('level', 20)
document.getElementById('speed').onchange = e => send('speed', Number(e.target.value))
setInterval(() => fetch('/api/state').then(r => r.json()).then(show), 1000)
fetch('/api/state').then(r => r.json()).then(show)
</script>
</body>
</html>
